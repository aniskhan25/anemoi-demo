theme: jekyll-theme-chirpy

lang: en
timezone: Europe/Helsinki

title: Anemoi Demo
tagline: Practical notes for running Anemoi on LUMI-G
description: >-
  A Chirpy-powered tutorial site for the Anemoi demo repository, focused on
  practical LUMI-G training workflows.

url: "https://aniskhan25.github.io"
baseurl: "/anemoi-demo"

github:
  username: aniskhan25

social:
  name: aniskhan25
  email:
  links:
    - https://github.com/aniskhan25
    - https://github.com/aniskhan25/anemoi-demo

theme_mode:
cdn:
avatar:
social_preview_image:

toc: true

comments:
  provider:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths: []

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
