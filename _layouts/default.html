<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #17181c;
        --fg: #d9dee7;
        --heading: #f7f8fa;
        --surface: #202228;
        --surface-border: #343844;
        --muted-border: #3c4350;
        --link: #8cc7eb;
        --heading-accent: #8cc7eb;
        --inline-code-bg: #2a303a;
        --inline-code-fg: #9ed1ee;
        --code-bg: #1e2730;
        --code-panel: #24313d;
        --code-fg: #eff6fb;
        --button-bg: #314050;
        --button-border: #466077;
        --button-hover: #3c5267;
        --note-border: #7477b8;
        --note-bg: #2b2c43;
        --warning-border: #ec008c;
        --warning-bg: #462236;
        --quote: #abb4c5;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f8fb;
          --fg: #3f4650;
          --heading: #1f2937;
          --surface: #ffffff;
          --surface-border: #e9edf3;
          --muted-border: #e5e7eb;
          --link: #2c6789;
          --heading-accent: #2c6789;
          --inline-code-bg: #f3f5f7;
          --inline-code-fg: #2c6789;
          --code-bg: #f4f7f9;
          --code-panel: #abc2d0;
          --code-fg: #f9fafb;
          --button-bg: #1f2937;
          --button-border: #374151;
          --button-hover: #374151;
          --note-border: #7477b8;
          --note-bg: #f4f4f9;
          --warning-border: #ec008c;
          --warning-bg: #fef2f9;
          --quote: #5b6470;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--fg);
        background: var(--bg);
        font: 1.05rem/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      main {
        width: min(52rem, calc(100vw - 2rem));
        margin: 0 auto;
        padding: 2.25rem 0 4rem;
      }

      h1, h2, h3 {
        line-height: 1.15;
        margin: 0 0 0.8rem;
        letter-spacing: -0.02em;
        color: var(--heading);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      h1 {
        margin-bottom: 1rem;
        font-size: clamp(2.25rem, 4vw, 3.2rem);
        font-weight: 700;
      }

      h2 {
        margin-top: 3rem;
        padding-bottom: 0.55rem;
        border-bottom: 1px solid var(--muted-border);
        font-size: 1.75rem;
      }

      h3 {
        margin-top: 2.25rem;
        margin-bottom: 0.4rem;
        line-height: 1.25;
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--heading-accent);
      }

      p, ul, ol {
        margin: 1rem 0 1.1rem;
      }

      ul, ol {
        margin-top: 0.75rem;
        margin-bottom: 1.5rem;
        padding-left: 1.4rem;
      }

      li {
        margin-bottom: 0.45rem;
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      strong {
        color: var(--heading);
      }

      code {
        padding: 0.12rem 0.35rem;
        border-radius: 0.35rem;
        background: var(--inline-code-bg);
        color: var(--inline-code-fg);
        font: 0.92em ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .highlighter-rouge {
        margin: 1.5rem 0;
        max-width: 100%;
      }

      .code-block {
        position: relative;
        margin: 1rem 0;
      }

      .copy-button {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        border: 1px solid var(--button-border);
        border-radius: 0.5rem;
        background: var(--button-bg);
        color: var(--code-fg);
        padding: 0.3rem 0.6rem;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        cursor: pointer;
      }

      .copy-button:hover {
        background: var(--button-hover);
      }

      pre {
        margin: 1rem 0;
        overflow-x: auto;
        padding: 1rem 3.5rem 1rem 1rem;
        border: 1px solid var(--code-panel);
        border-radius: 0.85rem;
        background: var(--code-bg);
        color: #17212b;
        box-shadow: none;
      }

      pre code {
        padding: 0;
        background: transparent;
        color: inherit;
        font-size: 0.93rem;
      }

      .highlight pre,
      .highlighter-rouge pre {
        background: var(--code-bg);
      }

      .highlight .c,
      .highlight .cm,
      .highlight .c1,
      .highlight .cs {
        color: #6b7280;
      }

      .highlight .k,
      .highlight .kd,
      .highlight .kp,
      .highlight .kr,
      .highlight .kt,
      .highlight .nt {
        color: #b4236b;
      }

      .highlight .s,
      .highlight .s1,
      .highlight .s2,
      .highlight .sb,
      .highlight .sh,
      .highlight .sx,
      .highlight .si {
        color: #0f766e;
      }

      .highlight .na,
      .highlight .nb,
      .highlight .bp,
      .highlight .nv,
      .highlight .vc,
      .highlight .vg,
      .highlight .vi {
        color: #2c6789;
      }

      .highlight .nf,
      .highlight .fm {
        color: #6d28d9;
      }

      .highlight .mi,
      .highlight .mf,
      .highlight .mh,
      .highlight .il,
      .highlight .mo {
        color: #b45309;
      }

      .highlight .o,
      .highlight .ow {
        color: #374151;
      }

      .highlight .err,
      .highlight .gd {
        color: #b91c1c;
      }

      .highlight .gi {
        color: #166534;
      }

      @media (prefers-color-scheme: dark) {
        pre {
          color: var(--code-fg);
        }

        .highlight .c,
        .highlight .cm,
        .highlight .c1,
        .highlight .cs {
          color: #94a3b8;
        }

        .highlight .k,
        .highlight .kd,
        .highlight .kp,
        .highlight .kr,
        .highlight .kt,
        .highlight .nt {
          color: #f472b6;
        }

        .highlight .s,
        .highlight .s1,
        .highlight .s2,
        .highlight .sb,
        .highlight .sh,
        .highlight .sx,
        .highlight .si {
          color: #5eead4;
        }

        .highlight .na,
        .highlight .nb,
        .highlight .bp,
        .highlight .nv,
        .highlight .vc,
        .highlight .vg,
        .highlight .vi {
          color: #93c5fd;
        }

        .highlight .nf,
        .highlight .fm {
          color: #c4b5fd;
        }

        .highlight .mi,
        .highlight .mf,
        .highlight .mh,
        .highlight .il,
        .highlight .mo {
          color: #fdba74;
        }

        .highlight .o,
        .highlight .ow {
          color: #cbd5e1;
        }

        .highlight .err,
        .highlight .gd {
          color: #fca5a5;
        }

        .highlight .gi {
          color: #86efac;
        }
      }

      hr {
        margin: 2rem 0;
        border: 0;
        border-top: 1px solid var(--muted-border);
      }

      blockquote {
        margin: 1.25rem 0 2rem;
        padding: 0.9rem 1.1rem;
        border-radius: 8px;
        border: 1px solid var(--note-border);
        border-left: 6px solid var(--note-border);
        background: var(--note-bg);
        color: inherit;
      }

      blockquote p:last-child {
        margin-bottom: 0;
      }

      blockquote.warning {
        border-color: var(--warning-border);
        background: var(--warning-bg);
      }

      .warning,
      .note {
        margin: 1.25rem 0 2rem;
        padding: 0.9rem 1.1rem;
        border-radius: 8px;
      }

      .note {
        border: 1px solid var(--note-border);
        border-left: 6px solid var(--note-border);
        background: var(--note-bg);
      }

      .warning {
        border: 1px solid var(--warning-border);
        border-left: 6px solid var(--warning-border);
        background: var(--warning-bg);
      }

      .note > :last-child,
      .warning > :last-child {
        margin-bottom: 0;
      }

      @media (max-width: 700px) {
        main {
          width: min(100vw - 1rem, 52rem);
          padding: 1rem 0 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main>{{ content }}</main>
    <script>
      function fallbackCopy(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "absolute";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }

      for (const pre of document.querySelectorAll("pre")) {
        const wrapper = document.createElement("div");
        wrapper.className = "code-block";
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const button = document.createElement("button");
        button.className = "copy-button";
        button.type = "button";
        button.textContent = "Copy";
        button.addEventListener("click", async () => {
          const text = pre.innerText;
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
            } else {
              fallbackCopy(text);
            }
            button.textContent = "Copied";
          } catch {
            button.textContent = "Failed";
          }
          setTimeout(() => {
            button.textContent = "Copy";
          }, 1200);
        });
        wrapper.appendChild(button);
      }
    </script>
  </body>
</html>
