<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #111827;
        background: #ffffff;
        font: 18px/1.7 Georgia, "Times New Roman", serif;
      }

      main {
        width: min(860px, calc(100vw - 2rem));
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }

      h1, h2, h3 {
        line-height: 1.15;
        margin: 0 0 0.8rem;
        letter-spacing: -0.02em;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
      }

      h2 {
        margin-top: 2.5rem;
        font-size: 1.7rem;
      }

      h3 {
        margin-top: 1.6rem;
        font-size: 1.18rem;
      }

      p, ul, ol {
        margin: 1rem 0;
      }

      a {
        color: inherit;
      }

      code {
        padding: 0.12rem 0.35rem;
        border-radius: 0.35rem;
        background: #f3f4f6;
        font: 0.92em ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      pre {
        overflow-x: auto;
        padding: 1rem 1.1rem;
        border-radius: 10px;
        background: #111827;
        color: #f9fafb;
      }

      pre code {
        padding: 0;
        background: transparent;
        color: inherit;
      }

      hr {
        margin: 2rem 0;
        border: 0;
        border-top: 1px solid #e5e7eb;
      }

      @media (max-width: 700px) {
        main {
          width: min(100vw - 1rem, 960px);
          padding: 1rem 0 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main>{{ content }}</main>
  </body>
</html>
