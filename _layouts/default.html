<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #1b1b1e;
        --fg: #c9ccd4;
        --heading: #f3f4f6;
        --surface: #232328;
        --surface-border: #31343b;
        --muted-border: #343841;
        --link: #7dd3fc;
        --inline-code-bg: #2b2e36;
        --code-bg: #111318;
        --code-fg: #f9fafb;
        --button-bg: #2f333d;
        --button-border: #4a5160;
        --button-hover: #3a4150;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f8fb;
          --fg: #3f4650;
          --heading: #1f2937;
          --surface: #ffffff;
          --surface-border: #e9edf3;
          --muted-border: #e5e7eb;
          --link: #2563eb;
          --inline-code-bg: #f3f4f6;
          --code-bg: #111827;
          --code-fg: #f9fafb;
          --button-bg: #1f2937;
          --button-border: #374151;
          --button-hover: #374151;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--fg);
        background: var(--bg);
        font: 1.08rem/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      main {
        width: min(980px, calc(100vw - 2rem));
        margin: 0 auto;
        padding: 2.5rem 0 4rem;
      }

      article {
        padding: 2.25rem 2.5rem 3rem;
        border: 1px solid var(--surface-border);
        border-radius: 1.1rem;
        background: var(--surface);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
      }

      h1, h2, h3 {
        line-height: 1.15;
        margin: 0 0 0.8rem;
        letter-spacing: -0.02em;
        color: var(--heading);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      h1 {
        margin-bottom: 1rem;
        font-size: clamp(2.25rem, 4vw, 3.2rem);
        font-weight: 700;
      }

      h2 {
        margin-top: 3rem;
        padding-bottom: 0.55rem;
        border-bottom: 1px solid var(--muted-border);
        font-size: 1.75rem;
      }

      h3 {
        margin-top: 1.6rem;
        font-size: 1.2rem;
      }

      p, ul, ol {
        margin: 1rem 0;
      }

      ul, ol {
        padding-left: 1.4rem;
      }

      li + li {
        margin-top: 0.35rem;
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      strong {
        color: var(--heading);
      }

      code {
        padding: 0.12rem 0.35rem;
        border-radius: 0.35rem;
        background: var(--inline-code-bg);
        font: 0.92em ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .code-block {
        position: relative;
        margin: 1rem 0;
      }

      .copy-button {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        border: 1px solid var(--button-border);
        border-radius: 0.5rem;
        background: var(--button-bg);
        color: var(--code-fg);
        padding: 0.3rem 0.6rem;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        cursor: pointer;
      }

      .copy-button:hover {
        background: var(--button-hover);
      }

      pre {
        margin: 1rem 0;
        overflow-x: auto;
        padding: 1rem 1.1rem 1.1rem;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 0.85rem;
        background: var(--code-bg);
        color: var(--code-fg);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
      }

      pre code {
        padding: 0;
        background: transparent;
        color: inherit;
        font-size: 0.93rem;
      }

      hr {
        margin: 2rem 0;
        border: 0;
        border-top: 1px solid var(--muted-border);
      }

      blockquote {
        margin: 1.25rem 0;
        padding: 0.1rem 0 0.1rem 1rem;
        border-left: 0.22rem solid #6b7280;
        color: #9ca3af;
      }

      @media (max-width: 700px) {
        main {
          width: min(100vw - 1rem, 960px);
          padding: 1rem 0 2rem;
        }

        article {
          padding: 1.35rem 1rem 2rem;
          border-radius: 0.85rem;
        }
      }
    </style>
  </head>
  <body>
    <main><article>{{ content }}</article></main>
    <script>
      function fallbackCopy(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "absolute";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }

      for (const pre of document.querySelectorAll("pre")) {
        const wrapper = document.createElement("div");
        wrapper.className = "code-block";
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const button = document.createElement("button");
        button.className = "copy-button";
        button.type = "button";
        button.textContent = "Copy";
        button.addEventListener("click", async () => {
          const text = pre.innerText;
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
            } else {
              fallbackCopy(text);
            }
            button.textContent = "Copied";
          } catch {
            button.textContent = "Failed";
          }
          setTimeout(() => {
            button.textContent = "Copy";
          }, 1200);
        });
        wrapper.appendChild(button);
      }
    </script>
  </body>
</html>
