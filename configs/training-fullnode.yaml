defaults:
  - data: zarr
  - dataloader: native_grid
  - diagnostics: evaluation
  - hardware: example
  - graph: multi_scale
  - model: gnn
  - training: default
  - _self_

# Dedicated full-node workflow config. This is separate from the minimal and
# partial-node configs because full-node runs have different startup behavior
# and should minimize validation overhead before real training starts.

config_validation: true

data:
  resolution: o48

hardware:
  num_gpus_per_node: 8
  num_nodes: 8
  num_gpus_per_model: 1
  paths:
    data: ${oc.env:ANEMOI_DATA_ROOT}
    graph: ${oc.env:ANEMOI_GRAPH_ROOT}
    output: ${oc.env:ANEMOI_OUTPUT_ROOT}
  files:
    dataset: era5-o48-2020-2021-6h-v1.zip
    graph: first_graph_o48.pt

dataloader:
  num_workers:
    training: 1
    validation: 1
    test: 1
  batch_size:
    training: 8
    validation: 8
    test: 8
  limit_batches:
    training: 500
    validation: 1
    test: 1

training:
  max_epochs: 1
  lr:
    rate: 1.0e-4

diagnostics:
  plot:
    callbacks: []
