defaults:
  - data: zarr
  - dataloader: native_grid
  - diagnostics: evaluation
  - system: example
  - graph: multi_scale
  - model: gnn
  - task: forecaster
  - training: single
  - _self_

# Minimal working config for the sample ERA5 dataset on LUMI-G using the
# pinned anemoi-training/anemoi-models/anemoi-graphs release set.

config_validation: true

data:
  resolution: o48

system:
  hardware:
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1
  input:
    dataset: ${oc.env:ANEMOI_DATA_ROOT}/era5-o48-2020-2021-6h-v1.zip
    graph: ${oc.env:ANEMOI_GRAPH_ROOT}/first_graph_o48.pt
  output:
    root: ${oc.env:ANEMOI_OUTPUT_ROOT}

dataloader:
  num_workers:
    training: 1
    validation: 1
    test: 1
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: 8
    validation: 2
    test: 2

training:
  max_epochs: 4
  optimization:
    lr: 1.0e-4

diagnostics:
  plot:
    callbacks: []
  log:
    # mlflow is disabled for this minimal run; clear the mandatory ??? so schema
    # validation does not trip on diagnostics.log.mlflow.tracking_uri
    mlflow:
      tracking_uri: null
