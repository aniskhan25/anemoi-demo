defaults:
  - data: zarr
  - dataloader: native_grid
  - diagnostics: evaluation
  - hardware: example
  - graph: multi_scale
  - model: gnn
  - training: single
  - _self_

# Single-node 2-GPU data-parallel config for the pinned release set.

config_validation: true

data:
  resolution: o48

hardware:
  num_gpus_per_node: 2
  num_nodes: 1
  num_gpus_per_model: 1
  paths:
    data: ${oc.env:ANEMOI_DATA_ROOT}
    graph: ${oc.env:ANEMOI_GRAPH_ROOT}
    output: ${oc.env:ANEMOI_OUTPUT_ROOT}
  files:
    dataset: era5-o48-2020-2021-6h-v1.zip
    graph: first_graph_o48.pt

dataloader:
  num_workers:
    training: 1
    validation: 1
    test: 1
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: 8
    validation: 2
    test: 2

training:
  max_epochs: 4
  lr:
    rate: 1.0e-4

diagnostics:
  plot:
    callbacks: []
